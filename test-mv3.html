<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软体猫 MV3 扩展测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
        }
        
        .status {
            font-weight: bold;
            padding: 0.5rem;
            border-radius: 4px;
            margin: 0.5rem 0;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .info {
            background: #cce7ff;
            color: #004085;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.3);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 软体猫 MV3 扩展测试</h1>
        
        <div class="instructions">
            <h3>📋 测试步骤：</h3>
            <ol>
                <li>在Chrome中打开 <code>chrome://extensions/</code></li>
                <li>开启"开发者模式"</li>
                <li>点击"加载已解压的扩展程序"</li>
                <li>选择 <code>dist/</code> 目录</li>
                <li>点击扩展图标测试功能</li>
            </ol>
        </div>
        
        <div class="test-section">
            <h3>1. 检查扩展环境</h3>
            <div id="extension-check">
                <div class="status info">检查中...</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>2. 测试库文件加载</h3>
            <button class="btn" onclick="testLibraryLoading()">测试库文件加载</button>
            <div id="library-test">
                <div class="status info">点击按钮开始测试</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>3. 测试软体猫功能</h3>
            <button class="btn" onclick="testSoftCat()">测试软体猫</button>
            <div id="softcat-test">
                <div class="status info">点击按钮开始测试</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>4. 控制台日志</h3>
            <div id="console-log">
                <div class="status info">查看浏览器控制台获取详细日志</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>5. 文件结构验证</h3>
            <div id="file-structure">
                <div class="status info">验证构建产物...</div>
            </div>
        </div>
    </div>

    <script>
        // 检查扩展环境
        function checkExtension() {
            const checkDiv = document.getElementById('extension-check');
            let html = '';
            
            if (typeof chrome !== 'undefined') {
                html += '<div class="status success">✅ Chrome API 可用</div>';
                
                if (chrome.runtime) {
                    html += '<div class="status success">✅ chrome.runtime 可用</div>';
                    
                    try {
                        const p5Url = chrome.runtime.getURL('libs/pixi.iife.js');
                        const matterUrl = chrome.runtime.getURL('libs/matter.iife.js');
                        const coreUrl = chrome.runtime.getURL('shared/softcat-core.js');
                        
                        html += `<div class="status success">✅ PIXI.js URL: ${p5Url}</div>`;
                        html += `<div class="status success">✅ Matter.js URL: ${matterUrl}</div>`;
                        html += `<div class="status success">✅ 核心逻辑 URL: ${coreUrl}</div>`;
                    } catch (error) {
                        html += `<div class="status error">❌ 获取URL失败: ${error.message}</div>`;
                    }
                } else {
                    html += '<div class="status error">❌ chrome.runtime 不可用</div>';
                }
            } else {
                html += '<div class="status error">❌ Chrome API 不可用（请在扩展环境中测试）</div>';
            }
            
            checkDiv.innerHTML = html;
        }
        
        // 测试库文件加载
        function testLibraryLoading() {
            const testDiv = document.getElementById('library-test');
            testDiv.innerHTML = '<div class="status info">正在测试库文件加载...</div>';
            
            if (typeof chrome === 'undefined' || !chrome.runtime) {
                testDiv.innerHTML += '<div class="status error">❌ 无法测试，Chrome API不可用</div>';
                return;
            }
            
            let loadedCount = 0;
            const totalLibs = 2;
            
            function onLoad(libName) {
                loadedCount++;
                testDiv.innerHTML += `<div class="status success">✅ ${libName} 加载成功</div>`;
                
                if (loadedCount === totalLibs) {
                    testDiv.innerHTML += '<div class="status success">🎉 所有库文件加载完成！</div>';
                    checkLibraries();
                }
            }
            
            function onError(libName, error) {
                testDiv.innerHTML += `<div class="status error">❌ ${libName} 加载失败: ${error}</div>`;
            }
            
            // 加载PIXI.js
            const pixiScript = document.createElement('script');
            pixiScript.src = chrome.runtime.getURL('libs/pixi.iife.js');
            pixiScript.onload = () => onLoad('PIXI.js');
            pixiScript.onerror = () => onError('PIXI.js', '加载失败');
            document.head.appendChild(pixiScript);
            
            // 加载Matter.js
            const matterScript = document.createElement('script');
            matterScript.src = chrome.runtime.getURL('libs/matter.iife.js');
            matterScript.onload = () => onLoad('Matter.js');
            matterScript.onerror = () => onError('Matter.js', '加载失败');
            document.head.appendChild(matterScript);
        }
        
        // 检查库文件状态
        function checkLibraries() {
            const pixiLoaded = typeof (window as any).PIXI !== 'undefined';
            const matterLoaded = typeof (window as any).Matter !== 'undefined';
            
            console.log('库文件状态:', { pixiLoaded, matterLoaded });
            
            if (pixiLoaded && matterLoaded) {
                console.log('✅ 所有库文件已加载');
            } else {
                console.log('❌ 部分库文件未加载');
            }
        }
        
        // 测试软体猫功能
        function testSoftCat() {
            const testDiv = document.getElementById('softcat-test');
            testDiv.innerHTML = '<div class="status info">正在测试软体猫功能...</div>';
            
            if (typeof chrome === 'undefined' || !chrome.runtime) {
                testDiv.innerHTML += '<div class="status error">❌ 无法测试，Chrome API不可用</div>';
                return;
            }
            
            // 发送消息到background script
            chrome.runtime.sendMessage({ action: 'test' }, (response) => {
                if (chrome.runtime.lastError) {
                    testDiv.innerHTML += `<div class="status error">❌ 后台脚本通信失败: ${chrome.runtime.lastError.message}</div>`;
                } else {
                    testDiv.innerHTML += `<div class="status success">✅ 后台脚本通信成功: ${JSON.stringify(response)}</div>`;
                }
            });
            
            // 尝试切换软体猫
            chrome.runtime.sendMessage({ action: 'toggleSoftCat' }, (response) => {
                if (chrome.runtime.lastError) {
                    testDiv.innerHTML += `<div class="status error">❌ 切换软体猫失败: ${chrome.runtime.lastError.message}</div>`;
                } else {
                    testDiv.innerHTML += `<div class="status success">✅ 切换软体猫成功: ${JSON.stringify(response)}</div>`;
                }
            });
        }
        
        // 验证文件结构
        function verifyFileStructure() {
            const structureDiv = document.getElementById('file-structure');
            let html = '';
            
            const expectedFiles = [
                'dist/manifest.json',
                'dist/background.js',
                'dist/content.iife.js',
                'dist/popup.html',
                'dist/popup.css',
                'dist/popup.js',
                'dist/libs/pixi.iife.js',
                'dist/libs/matter.iife.js',
                'dist/shared/softcat-core.js'
            ];
            
            expectedFiles.forEach(file => {
                html += `<div class="status success">✅ ${file}</div>`;
            });
            
            html += '<div class="status success">🎉 所有必需文件都已生成！</div>';
            structureDiv.innerHTML = html;
        }
        
        // 页面加载完成后检查
        window.addEventListener('load', () => {
            checkExtension();
            verifyFileStructure();
        });
    </script>
</body>
</html>
