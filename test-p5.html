<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软体猫p5.js测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
        }
        
        .status {
            font-weight: bold;
            padding: 0.5rem;
            border-radius: 4px;
            margin: 0.5rem 0;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .info {
            background: #cce7ff;
            color: #004085;
        }
        
        #test-canvas {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            margin: 1rem 0;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 软体猫 p5.js 测试页面</h1>
        
        <div class="test-section">
            <h3>库文件加载状态</h3>
            <div id="library-status">
                <div class="status info">检查中...</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>p5.js 画布测试</h3>
            <div id="test-canvas"></div>
            <button class="btn" onclick="testP5Canvas()">测试p5.js画布</button>
            <button class="btn" onclick="testMatterPhysics()">测试Matter.js物理</button>
        </div>
        
        <div class="test-section">
            <h3>扩展测试</h3>
            <p>请确保软体猫扩展已安装并启用，然后点击扩展图标测试软体猫功能。</p>
            <div id="extension-status">
                <div class="status info">等待扩展连接...</div>
            </div>
        </div>
    </div>

    <script>
        // 检查库文件加载状态
        function checkLibraries() {
            const statusDiv = document.getElementById('library-status');
            
            const p5Loaded = typeof p5 !== 'undefined';
            const matterLoaded = typeof Matter !== 'undefined';
            
            let statusHTML = '';
            
            if (p5Loaded) {
                statusHTML += '<div class="status success">✅ p5.js 已加载 (版本: ' + (p5.VERSION || '未知') + ')</div>';
            } else {
                statusHTML += '<div class="status error">❌ p5.js 未加载</div>';
            }
            
            if (matterLoaded) {
                statusHTML += '<div class="status success">✅ Matter.js 已加载 (版本: ' + (Matter.version || '未知') + ')</div>';
            } else {
                statusHTML += '<div class="status error">❌ Matter.js 未加载</div>';
            }
            
            if (p5Loaded && matterLoaded) {
                statusHTML += '<div class="status success">🎉 所有库文件加载完成！</div>';
            } else {
                statusHTML += '<div class="status error">⚠️ 部分库文件未加载</div>';
            }
            
            statusDiv.innerHTML = statusHTML;
        }
        
        // 测试p5.js画布
        function testP5Canvas() {
            if (typeof p5 === 'undefined') {
                alert('p5.js 未加载！');
                return;
            }
            
            const canvasContainer = document.getElementById('test-canvas');
            canvasContainer.innerHTML = '';
            
            new p5((p) => {
                p.setup = () => {
                    const canvas = p.createCanvas(400, 300);
                    canvas.parent('test-canvas');
                    p.background(100, 150, 200);
                };
                
                p.draw = () => {
                    p.background(100, 150, 200, 10);
                    p.fill(255, 100, 100);
                    p.noStroke();
                    p.ellipse(p.mouseX, p.mouseY, 20, 20);
                    
                    // 绘制一些动画
                    p.fill(255, 255, 100);
                    p.ellipse(p.width/2 + p.sin(p.frameCount * 0.05) * 50, p.height/2, 30, 30);
                };
            }, canvasContainer);
        }
        
        // 测试Matter.js物理
        function testMatterPhysics() {
            if (typeof Matter === 'undefined') {
                alert('Matter.js 未加载！');
                return;
            }
            
            const { Engine, Render, World, Bodies } = Matter;
            
            // 创建引擎
            const engine = Engine.create();
            
            // 创建渲染器
            const render = Render.create({
                element: document.getElementById('test-canvas'),
                engine: engine,
                options: {
                    width: 400,
                    height: 300,
                    wireframes: true,
                    background: 'rgba(100, 150, 200, 0.1)'
                }
            });
            
            // 创建一些物理对象
            const boxA = Bodies.rectangle(200, 200, 80, 80);
            const boxB = Bodies.rectangle(200, 100, 80, 80);
            const ground = Bodies.rectangle(200, 300, 400, 60, { isStatic: true });
            
            // 添加到世界
            World.add(engine.world, [boxA, boxB, ground]);
            
            // 运行引擎和渲染器
            Engine.run(engine);
            Render.run(render);
            
            console.log('Matter.js 物理测试已启动');
        }
        
        // 检查扩展状态
        function checkExtension() {
            const statusDiv = document.getElementById('extension-status');
            
            if (typeof chrome !== 'undefined' && chrome.runtime) {
                statusDiv.innerHTML = '<div class="status success">✅ Chrome扩展环境可用</div>';
            } else {
                statusDiv.innerHTML = '<div class="status error">❌ Chrome扩展环境不可用</div>';
            }
        }
        
        // 页面加载完成后检查
        window.addEventListener('load', () => {
            checkLibraries();
            checkExtension();
            
            // 定期检查库文件状态
            setInterval(checkLibraries, 2000);
        });
    </script>
</body>
</html>
