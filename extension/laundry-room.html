<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软体猫洗衣房 - 浏览记录管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .feature-placeholder {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .feature-placeholder h3 {
      margin-bottom: 10px;
      color: #333;
    }

    .coming-soon {
      background: #f8f9fa;
      border: 2px dashed #dee2e6;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
      color: #6c757d;
    }

    .btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .tabs-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .tab-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s ease;
    }

    .tab-item:hover {
      background-color: #f8f9fa;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      margin-right: 12px;
    }

    .tab-title {
      flex: 1;
      font-size: 14px;
      color: #333;
    }

    .tab-url {
      font-size: 12px;
      color: #666;
      margin-left: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏠 软体猫洗衣房</h1>
      <p>管理你的浏览记录，让软体猫帮你整理标签页</p>
    </div>

    <div class="card">
      <h2>📊 浏览统计</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalTabs">-</div>
          <div class="stat-label">总标签页数</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="activeTabs">-</div>
          <div class="stat-label">活跃标签页</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="pinnedTabs">-</div>
          <div class="stat-label">固定标签页</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="windowsCount">-</div>
          <div class="stat-label">窗口数量</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📋 当前标签页</h2>
      <div class="tabs-list" id="tabsList">
        <div class="coming-soon">
          <h3>🔄 加载中...</h3>
          <p>正在获取标签页信息...</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🔍 查询记录</h2>
      <div class="feature-placeholder">
        <h3>🔍 智能搜索功能</h3>
        <p>输入关键词，软体猫会帮你找到相关的浏览记录</p>
        <div class="coming-soon">
          <p>🚧 功能开发中，敬请期待...</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📈 浏览历史分析</h2>
      <div class="feature-placeholder">
        <h3>📊 数据分析面板</h3>
        <p>查看你的浏览习惯，了解最常访问的网站</p>
        <div class="coming-soon">
          <p>🚧 功能开发中，敬请期待...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 获取标签页信息
    async function loadTabsData() {
      try {
        const response = await chrome.runtime.sendMessage({ action: 'collectAllTabs' });
        
        if (response && response.success) {
          const tabs = response.tabs;
          
          // 更新统计信息
          document.getElementById('totalTabs').textContent = tabs.length;
          document.getElementById('activeTabs').textContent = tabs.filter(tab => tab.active).length;
          document.getElementById('pinnedTabs').textContent = tabs.filter(tab => tab.pinned).length;
          
          // 计算窗口数量
          const windows = new Set(tabs.map(tab => tab.windowId));
          document.getElementById('windowsCount').textContent = windows.size;
          
          // 显示标签页列表
          displayTabsList(tabs);
        } else {
          throw new Error(response?.error || '获取标签页失败');
        }
      } catch (error) {
        console.error('加载标签页数据失败:', error);
        document.getElementById('tabsList').innerHTML = `
          <div class="coming-soon">
            <h3>❌ 加载失败</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // 显示标签页列表
    function displayTabsList(tabs) {
      const tabsList = document.getElementById('tabsList');
      
      if (tabs.length === 0) {
        tabsList.innerHTML = `
          <div class="coming-soon">
            <h3>📭 没有标签页</h3>
            <p>当前没有打开的标签页</p>
          </div>
        `;
        return;
      }

      const tabsHtml = tabs.map(tab => `
        <div class="tab-item">
          <img src="${tab.favIconUrl || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M7 7h10M7 11h10M7 15h4"/></svg>"}' 
               class="tab-favicon" 
               onerror="this.src='data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"/><path d=\"M7 7h10M7 11h10M7 15h4\"/></svg>'" />
          <div class="tab-title">${tab.title || '无标题'}</div>
          <div class="tab-url">${tab.url}</div>
        </div>
      `).join('');

      tabsList.innerHTML = tabsHtml;
    }

    // 页面加载完成后获取数据
    document.addEventListener('DOMContentLoaded', loadTabsData);
  </script>
</body>
</html>
