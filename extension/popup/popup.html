<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软体猫桌宠</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="icon">🐱</div>
            <h1 class="title">软体猫桌宠</h1>
            <div class="version">v1.0.0</div>
        </header>
        
        <!-- 状态显示 -->
        <div class="status-section">
            <div id="status" class="status inactive">
                ⭕ 软体猫已停止
            </div>
        </div>
        
        <!-- 主要控制按钮 -->
        <div class="controls">
            <button id="toggleSoftCat" class="btn btn-primary">
                开启软体猫
            </button>
        </div>
        
        <!-- 功能按钮 -->
        <div class="features">
            <button id="toggleDebug" class="btn btn-secondary">
                🔍 调试模式
            </button>
            <button id="resetCat" class="btn btn-secondary">
                🔄 重置形状
            </button>
        </div>
        
        <!-- 底部链接 -->
        <footer class="footer">
            <button id="settings" class="link-btn">⚙️ 设置</button>
            <button id="help" class="link-btn">❓ 帮助</button>
        </footer>
        
        <!-- 快捷键提示 -->
        <div class="shortcuts">
            <div class="shortcuts-title">快捷键：</div>
            <div class="shortcut-item">
                <kbd>V</kbd> 切换调试模式
            </div>
            <div class="shortcut-item">
                <kbd>R</kbd> 重置软体猫
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
