<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直接测试软体猫</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover { background: #0056b3; }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #cce7ff; color: #004085; }
    </style>
</head>
<body>
    <h1>🐱 直接测试软体猫</h1>
    
    <div>
        <button class="btn" onclick="testDirectLoading()">直接加载库文件</button>
        <button class="btn" onclick="testExtensionAPI()">测试扩展API</button>
    </div>
    
    <div id="status">
        <div class="status info">点击按钮开始测试</div>
    </div>
    
    <div id="log" style="background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 4px; font-family: monospace; max-height: 300px; overflow-y: auto;">
        <div>等待日志...</div>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(message, type = 'info') {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        async function testDirectLoading() {
            log('开始直接加载库文件...');
            updateStatus('加载中...', 'info');
            
            try {
                // 检查Chrome API
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                
                log('Chrome API 可用');
                
                // 直接加载PIXI.js
                log('加载PIXI.js...');
                const pixiScript = document.createElement('script');
                pixiScript.src = chrome.runtime.getURL('libs/pixi.iife.js');
                await new Promise((resolve, reject) => {
                    pixiScript.onload = () => {
                        log('PIXI.js 加载成功');
                        resolve();
                    };
                    pixiScript.onerror = () => {
                        log('PIXI.js 加载失败');
                        reject(new Error('PIXI.js 加载失败'));
                    };
                    document.head.appendChild(pixiScript);
                });
                
                // 直接加载Matter.js
                log('加载Matter.js...');
                const matterScript = document.createElement('script');
                matterScript.src = chrome.runtime.getURL('libs/matter.iife.js');
                await new Promise((resolve, reject) => {
                    matterScript.onload = () => {
                        log('Matter.js 加载成功');
                        resolve();
                    };
                    matterScript.onerror = () => {
                        log('Matter.js 加载失败');
                        reject(new Error('Matter.js 加载失败'));
                    };
                    document.head.appendChild(matterScript);
                });
                
                // 等待库文件就绪
                log('等待库文件就绪...');
                await new Promise((resolve) => {
                    const checkInterval = setInterval(() => {
                        if (typeof window.PIXI !== 'undefined' && typeof window.Matter !== 'undefined') {
                            clearInterval(checkInterval);
                            log('库文件就绪！');
                            resolve();
                        }
                    }, 50);
                });
                
                // 加载核心逻辑
                log('加载核心逻辑...');
                const coreScript = document.createElement('script');
                coreScript.src = chrome.runtime.getURL('shared/softcat-core.js');
                await new Promise((resolve, reject) => {
                    coreScript.onload = () => {
                        log('核心逻辑加载成功');
                        resolve();
                    };
                    coreScript.onerror = () => {
                        log('核心逻辑加载失败');
                        reject(new Error('核心逻辑加载失败'));
                    };
                    document.head.appendChild(coreScript);
                });
                
                updateStatus('✅ 所有库文件加载成功！', 'success');
                log('🎉 软体猫应该可以运行了！');
                
            } catch (error) {
                log('❌ 加载失败: ' + error.message);
                updateStatus('❌ 加载失败: ' + error.message, 'error');
            }
        }
        
        async function testExtensionAPI() {
            log('测试扩展API...');
            updateStatus('测试中...', 'info');
            
            try {
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                
                const response = await chrome.runtime.sendMessage({ action: 'test' });
                log('扩展API响应: ' + JSON.stringify(response));
                updateStatus('✅ 扩展API正常工作', 'success');
                
            } catch (error) {
                log('❌ 扩展API测试失败: ' + error.message);
                updateStatus('❌ 扩展API测试失败: ' + error.message, 'error');
            }
        }
        
        // 页面加载完成
        window.addEventListener('load', () => {
            log('页面加载完成');
            log('当前URL: ' + window.location.href);
        });
    </script>
</body>
</html>
