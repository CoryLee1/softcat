<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单文件内容脚本渲染测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #0056b3; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #cce7ff; color: #004085; }
    </style>
</head>
<body>
    <h1>🐱 单文件内容脚本渲染测试</h1>
    <div>
        <button class="btn" onclick="testExtensionAPI()">测试扩展API</button>
        <button class="btn" onclick="testToggle()">切换软体猫</button>
    </div>
    <div id="status">
        <div class="status info">点击按钮开始测试</div>
    </div>
    <div id="log" style="background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 4px; font-family: monospace; max-height: 300px; overflow-y: auto;">
        <div>等待日志...</div>
    </div>
    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        function updateStatus(message, type = 'info') {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        async function testExtensionAPI() {
            log('测试扩展API...');
            updateStatus('测试中...', 'info');
            try {
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                const response = await chrome.runtime.sendMessage({ action: 'test' });
                log('扩展API响应: ' + JSON.stringify(response));
                updateStatus('✅ 扩展API正常工作', 'success');
            } catch (error) {
                log('❌ 扩展API测试失败: ' + error.message);
                updateStatus('❌ 扩展API测试失败: ' + error.message, 'error');
            }
        }
        async function testToggle() {
            log('切换软体猫...');
            updateStatus('切换中...', 'info');
            try {
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                const response = await chrome.runtime.sendMessage({ action: 'toggleSoftCat' });
                log('切换响应: ' + JSON.stringify(response));
                updateStatus('✅ 切换完成', 'success');
            } catch (error) {
                log('❌ 切换失败: ' + error.message);
                updateStatus('❌ 切换失败: ' + error.message, 'error');
            }
        }
        window.addEventListener('load', () => {
            log('页面加载完成');
            log('当前URL: ' + window.location.href);
        });
    </script>
</body>
</html>
