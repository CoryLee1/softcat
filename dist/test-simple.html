<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软体猫测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.3); border: 1px solid #4CAF50; }
        .error { background: rgba(244, 67, 54, 0.3); border: 1px solid #f44336; }
        .info { background: rgba(33, 150, 243, 0.3); border: 1px solid #2196F3; }
        .warning { background: rgba(255, 152, 0, 0.3); border: 1px solid #FF9800; }
        
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        h3 {
            color: #FFD700;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 软体猫测试页面</h1>
        
        <div class="test-section">
            <h3>1. 扩展状态检查</h3>
            <button class="btn" onclick="checkExtensionStatus()">检查扩展状态</button>
            <div id="extension-status">
                <div class="status info">点击按钮开始检查</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>2. 库文件测试</h3>
            <button class="btn" onclick="testLibraries()">测试库文件</button>
            <div id="library-status">
                <div class="status info">点击按钮开始测试</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>3. 软体猫控制</h3>
            <button class="btn" id="toggle-btn" onclick="toggleSoftCat()">启动软体猫</button>
            <button class="btn" onclick="getSoftCatStatus()">获取状态</button>
            <div id="softcat-status">
                <div class="status info">点击按钮控制软体猫</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>4. 控制台日志</h3>
            <div class="log" id="console-log">
                <div>等待日志输出...</div>
            </div>
            <button class="btn" onclick="clearLog()">清空日志</button>
        </div>
    </div>

    <script>
        let softcatRunning = false;
        const logDiv = document.getElementById('console-log');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `[${timestamp}] ${message}`;
            logEntry.style.color = type === 'error' ? '#ff6b6b' : 
                                  type === 'success' ? '#51cf66' : 
                                  type === 'warning' ? '#ffd43b' : '#74c0fc';
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            logDiv.innerHTML = '<div>日志已清空</div>';
        }
        
        function updateStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        async function checkExtensionStatus() {
            log('开始检查扩展状态...');
            updateStatus('extension-status', '检查中...', 'info');
            
            try {
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                
                const response = await chrome.runtime.sendMessage({ action: 'test' });
                log('扩展API响应: ' + JSON.stringify(response), 'success');
                updateStatus('extension-status', '✅ 扩展API正常工作', 'success');
                
            } catch (error) {
                log('扩展检查失败: ' + error.message, 'error');
                updateStatus('extension-status', '❌ 扩展检查失败: ' + error.message, 'error');
            }
        }
        
        async function testLibraries() {
            log('开始测试库文件...');
            updateStatus('library-status', '测试中...', 'info');
            
            try {
                const response = await chrome.runtime.sendMessage({ action: 'getSoftCatStatus' });
                log('库文件状态: ' + JSON.stringify(response), 'info');
                
                let statusMessage = '';
                if (response.pixiAvailable && response.matterAvailable) {
                    statusMessage = '✅ 所有库文件已加载';
                    log('库文件测试成功', 'success');
                } else {
                    statusMessage = `❌ 库文件未完全加载 - PIXI: ${response.pixiAvailable}, Matter: ${response.matterAvailable}`;
                    log('库文件测试失败', 'error');
                }
                
                updateStatus('library-status', statusMessage, 
                    response.pixiAvailable && response.matterAvailable ? 'success' : 'error');
                
            } catch (error) {
                log('库文件测试失败: ' + error.message, 'error');
                updateStatus('library-status', '❌ 库文件测试失败: ' + error.message, 'error');
            }
        }
        
        async function toggleSoftCat() {
            const btn = document.getElementById('toggle-btn');
            const statusDiv = document.getElementById('softcat-status');
            
            try {
                btn.disabled = true;
                btn.textContent = softcatRunning ? '停止中...' : '启动中...';
                
                const response = await chrome.runtime.sendMessage({ action: 'toggleSoftCat' });
                log('软体猫操作响应: ' + JSON.stringify(response), 'info');
                
                if (response.success) {
                    softcatRunning = response.enabled;
                    btn.textContent = softcatRunning ? '停止软体猫' : '启动软体猫';
                    updateStatus('softcat-status', response.message, 'success');
                    log(softcatRunning ? '软体猫已启动' : '软体猫已停止', 'success');
                } else {
                    updateStatus('softcat-status', '❌ ' + (response.error || response.message), 'error');
                    log('软体猫操作失败: ' + (response.error || response.message), 'error');
                }
                
            } catch (error) {
                log('软体猫操作失败: ' + error.message, 'error');
                updateStatus('softcat-status', '❌ 操作失败: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }
        
        async function getSoftCatStatus() {
            try {
                const response = await chrome.runtime.sendMessage({ action: 'getSoftCatStatus' });
                log('软体猫状态: ' + JSON.stringify(response), 'info');
                
                let statusMessage = `加载状态: ${response.loaded ? '已加载' : '未加载'}<br>`;
                statusMessage += `运行状态: ${response.running ? '运行中' : '未运行'}<br>`;
                statusMessage += `PIXI可用: ${response.pixiAvailable ? '是' : '否'}<br>`;
                statusMessage += `Matter可用: ${response.matterAvailable ? '是' : '否'}`;
                
                updateStatus('softcat-status', statusMessage, 'info');
                
            } catch (error) {
                log('获取状态失败: ' + error.message, 'error');
                updateStatus('softcat-status', '❌ 获取状态失败: ' + error.message, 'error');
            }
        }
        
        // 页面加载完成后的初始化
        window.addEventListener('load', () => {
            log('测试页面加载完成');
            log('当前URL: ' + window.location.href);
            log('Chrome API可用: ' + (typeof chrome !== 'undefined' && !!chrome.runtime));
        });
        
        // 监听来自内容脚本的消息
        if (typeof chrome !== 'undefined' && chrome.runtime) {
            chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
                log('收到消息: ' + JSON.stringify(request), 'info');
                return true;
            });
        }
    </script>
</body>
</html>
