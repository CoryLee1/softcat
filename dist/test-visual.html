<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软体猫视觉测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            min-height: 100vh;
            margin: 0;
        }
        .test-info {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }
        .btn:hover { background: #0056b3; }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #cce7ff; color: #004085; }
        .warning { background: #fff3cd; color: #856404; }
        
        .debug-panel {
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }
        
        h1 {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🐱 软体猫视觉测试页面</h1>
    
    <div class="instructions">
        <h3>测试说明：</h3>
        <ol>
            <li>确保软体猫扩展已加载并启用</li>
            <li>点击"检查扩展状态"按钮</li>
            <li>点击"启动软体猫"按钮</li>
            <li>查看页面上是否出现蓝色边框的容器和红色边框的Canvas</li>
            <li>应该能看到粉色圆形软体猫在页面上弹跳</li>
        </ol>
    </div>
    
    <div class="test-info">
        <h3>1. 扩展状态检查</h3>
        <button class="btn" onclick="checkExtension()">检查扩展状态</button>
        <div id="extension-status">
            <div class="status info">点击按钮开始检查</div>
        </div>
    </div>
    
    <div class="test-info">
        <h3>2. 软体猫控制</h3>
        <button class="btn" onclick="toggleSoftCat()">启动软体猫</button>
        <button class="btn" onclick="stopSoftCat()">停止软体猫</button>
        <div id="softcat-status">
            <div class="status info">点击按钮控制软体猫</div>
        </div>
    </div>
    
    <div class="test-info">
        <h3>3. 调试信息</h3>
        <button class="btn" onclick="clearDebug()">清空调试信息</button>
        <div class="debug-panel" id="debug-log">
            <div>等待调试信息...</div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const debugDiv = document.getElementById('debug-log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff6b6b' : 
                         type === 'success' ? '#00ff00' : 
                         type === 'warning' ? '#ffaa00' : '#00aaff';
            debugDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
        
        function clearDebug() {
            document.getElementById('debug-log').innerHTML = '<div>调试信息已清空</div>';
        }
        
        function updateStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        async function checkExtension() {
            log('开始检查扩展状态...');
            updateStatus('extension-status', '检查中...', 'info');
            
            try {
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                
                const response = await chrome.runtime.sendMessage({ action: 'test' });
                log('扩展API响应: ' + JSON.stringify(response), 'success');
                updateStatus('extension-status', '✅ 扩展API正常工作', 'success');
                
            } catch (error) {
                log('扩展检查失败: ' + error.message, 'error');
                updateStatus('extension-status', '❌ 扩展检查失败: ' + error.message, 'error');
            }
        }
        
        async function toggleSoftCat() {
            log('启动软体猫...');
            updateStatus('softcat-status', '启动中...', 'info');
            
            try {
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                
                const response = await chrome.runtime.sendMessage({ action: 'toggleSoftCat' });
                log('启动响应: ' + JSON.stringify(response), 'success');
                updateStatus('softcat-status', '✅ 软体猫已启动', 'success');
                
            } catch (error) {
                log('启动失败: ' + error.message, 'error');
                updateStatus('softcat-status', '❌ 启动失败: ' + error.message, 'error');
            }
        }
        
        async function stopSoftCat() {
            log('停止软体猫...');
            updateStatus('softcat-status', '停止中...', 'info');
            
            try {
                if (typeof chrome === 'undefined' || !chrome.runtime) {
                    throw new Error('Chrome扩展API不可用');
                }
                
                const response = await chrome.runtime.sendMessage({ action: 'stopSoftCat' });
                log('停止响应: ' + JSON.stringify(response), 'success');
                updateStatus('softcat-status', '✅ 软体猫已停止', 'success');
                
            } catch (error) {
                log('停止失败: ' + error.message, 'error');
                updateStatus('softcat-status', '❌ 停止失败: ' + error.message, 'error');
            }
        }
        
        // 页面加载完成
        window.addEventListener('load', () => {
            log('页面加载完成');
            log('当前URL: ' + window.location.href);
            log('Chrome API可用: ' + (typeof chrome !== 'undefined' && !!chrome.runtime));
        });
        
        // 监听来自内容脚本的消息
        if (typeof chrome !== 'undefined' && chrome.runtime) {
            chrome.runtime.onMessage.addListener((request, sender, sendResponse) => {
                log('收到消息: ' + JSON.stringify(request), 'info');
                return true;
            });
        }
        
        // 定期检查软体猫状态
        setInterval(() => {
            const container = document.getElementById('softcat-root');
            const canvas = container ? container.querySelector('canvas') : null;
            if (container) {
                log('软体猫容器存在: ' + container.offsetWidth + 'x' + container.offsetHeight, 'success');
            }
            if (canvas) {
                log('软体猫Canvas存在: ' + canvas.offsetWidth + 'x' + canvas.offsetHeight, 'success');
            }
        }, 3000);
    </script>
</body>
</html>
