<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软体猫最终测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.2);
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        
        .status {
            font-weight: bold;
            padding: 0.5rem;
            border-radius: 4px;
            margin: 0.5rem 0;
        }
        
        .success {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
        }
        
        .info {
            background: rgba(33, 150, 243, 0.3);
            color: #2196f3;
        }
        
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #1976d2;
        }
        
        #log {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 软体猫桌宠最终测试</h1>
        
        <div class="test-section">
            <h3>📋 测试步骤</h3>
            <ol>
                <li>确保软体猫扩展已安装并启用</li>
                <li>点击扩展图标打开弹窗</li>
                <li>点击"切换软体猫"按钮</li>
                <li>观察页面上的软体猫和下面的状态信息</li>
            </ol>
        </div>
        
        <div class="test-section">
            <h3>🔍 库文件检查</h3>
            <div id="libraryStatus">
                <div class="status info">检查中...</div>
            </div>
            <button onclick="checkLibraries()">重新检查库文件</button>
        </div>
        
        <div class="test-section">
            <h3>🎮 软体猫控制</h3>
            <button onclick="toggleSoftCat()">切换软体猫</button>
            <button onclick="toggleDebug()">切换调试模式</button>
            <button onclick="resetCat()">重置软体猫</button>
        </div>
        
        <div class="test-section">
            <h3>📊 状态信息</h3>
            <div id="catStatus">
                <div class="status info">等待软体猫加载...</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>📝 调试日志</h3>
            <div id="log"></div>
            <button onclick="clearLog()">清空日志</button>
        </div>
    </div>
    
    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}\n`;
            logDiv.textContent += logEntry;
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log').textContent = '';
        }
        
        function checkLibraries() {
            const statusDiv = document.getElementById('libraryStatus');
            
            const pixiLoaded = typeof PIXI !== 'undefined';
            const matterLoaded = typeof Matter !== 'undefined';
            
            let statusHTML = '';
            
            if (pixiLoaded) {
                statusHTML += '<div class="status success">✅ PIXI.js 已加载</div>';
                log('PIXI.js 库已正确加载');
            } else {
                statusHTML += '<div class="status error">❌ PIXI.js 未加载</div>';
                log('PIXI.js 库未加载', 'error');
            }
            
            if (matterLoaded) {
                statusHTML += '<div class="status success">✅ Matter.js 已加载</div>';
                log('Matter.js 库已正确加载');
            } else {
                statusHTML += '<div class="status error">❌ Matter.js 未加载</div>';
                log('Matter.js 库未加载', 'error');
            }
            
            if (pixiLoaded && matterLoaded) {
                statusHTML += '<div class="status success">🎉 所有库文件已正确加载！</div>';
                log('所有库文件已正确加载，软体猫可以正常启动');
            } else {
                statusHTML += '<div class="status error">⚠️ 库文件加载不完整</div>';
                log('库文件加载不完整，软体猫可能无法正常启动', 'error');
            }
            
            statusDiv.innerHTML = statusHTML;
        }
        
        function toggleSoftCat() {
            if (window.SoftCat) {
                if (window.SoftCat.isRunning()) {
                    window.SoftCat.stop();
                    log('软体猫已停止');
                    updateCatStatus('软体猫已停止');
                } else {
                    window.SoftCat.start();
                    log('软体猫已启动');
                    updateCatStatus('软体猫已启动');
                }
            } else {
                log('软体猫未加载，请检查扩展是否正确安装', 'error');
                updateCatStatus('软体猫未加载');
            }
        }
        
        function toggleDebug() {
            if (window.SoftCat && window.SoftCat.toggleDebug) {
                window.SoftCat.toggleDebug();
                log('调试模式已切换');
            } else {
                log('软体猫未加载，无法切换调试模式', 'error');
            }
        }
        
        function resetCat() {
            if (window.SoftCat && window.SoftCat.resetCat) {
                window.SoftCat.resetCat();
                log('软体猫已重置');
            } else {
                log('软体猫未加载，无法重置', 'error');
            }
        }
        
        function updateCatStatus(message) {
            const statusDiv = document.getElementById('catStatus');
            const isRunning = window.SoftCat && window.SoftCat.isRunning();
            
            let statusClass = 'info';
            if (isRunning) {
                statusClass = 'success';
            } else if (message.includes('未加载') || message.includes('错误')) {
                statusClass = 'error';
            }
            
            statusDiv.innerHTML = `<div class="status ${statusClass}">${message}</div>`;
        }
        
        // 页面加载完成后自动检查
        document.addEventListener('DOMContentLoaded', function() {
            log('页面加载完成，开始检查库文件...');
            setTimeout(checkLibraries, 1000);
            
            // 定期检查软体猫状态
            setInterval(() => {
                if (window.SoftCat) {
                    const isRunning = window.SoftCat.isRunning();
                    updateCatStatus(isRunning ? '软体猫运行中' : '软体猫已停止');
                }
            }, 2000);
        });
        
        // 监听软体猫容器变化
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    const container = document.getElementById('softcat-container');
                    if (container) {
                        log('软体猫容器已创建');
                        updateCatStatus('软体猫容器已创建');
                    }
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    </script>
</body>
</html>
